# Build and deploy the two sites.
#
# The notes site publishes a different repository, so pushing a note there does
# not trigger anything here. The hourly schedule is what makes "push a note, the
# site updates" true — and it needs nothing whatsoever in the notes repo.
#
# Reading a public vault requires no authentication.
#
# To actually publish, add a repository secret CLOUDFLARE_API_TOKEN, created from
# the "Edit Cloudflare Workers" template. Until it exists the workflow still
# builds both sites — it just skips the deploy rather than failing.

name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Lifted to env so a step `if:` can test whether it was ever configured.
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: landing site
            dir: apps/site
          - name: notes
            dir: apps/notes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Astro 6 requires >=22.12. Node 20 builds nothing and fails late,
          # after install, which is a slow way to learn that.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build packages
        run: npx tsc --build packages/core packages/astro

      - name: Build ${{ matrix.name }}
        working-directory: ${{ matrix.dir }}
        run: npx astro build

      - name: Deploy ${{ matrix.name }}
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: ${{ matrix.dir }}

      - name: Deploy skipped
        if: env.CF_TOKEN == ''
        run: |
          echo "::notice::Built ${{ matrix.name }} but did not deploy —"\
               "CLOUDFLARE_API_TOKEN is not set on this repository."
